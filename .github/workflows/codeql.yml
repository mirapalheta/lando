name: CodeQL

on:
  pull_request:
  schedule:
    # Weekly on Monday at 03:17 UTC
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # Code scanning needs GitHub Advanced Security on private repositories;
  # without it the upload fails. Analyse public copies only. The visibility
  # is read from the API because scheduled runs carry no repository payload.
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    outputs:
      private: ${{ steps.read.outputs.private }}
    steps:
      - name: Read visibility
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: visibility
    if: ${{ needs.visibility.outputs.private == 'false' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (C# only)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build (C# only)
        if: matrix.language == 'csharp'
        run: dotnet build --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: ${{ matrix.language }}
