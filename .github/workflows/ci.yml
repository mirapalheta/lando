name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # .NET build + test (App)
  # ─────────────────────────────────────────────
  dotnet:
    name: .NET 10
    runs-on: "ubuntu-latest"
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 🖋️ Format check
        run: dotnet format --verify-no-changes  --verbosity diagnostic

      - name: 📥 Restore
        run: dotnet restore

      - name: 🏗️ Build
        run: dotnet build --configuration Release --no-restore

      - name: 🧪 Test with coverage
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --settings tests/Test.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage \
            --logger "console;verbosity=normal"

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: coverage
          flags: dotnet
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────
  # AWS Lambda proxy (TypeScript / Node 26)
  # ─────────────────────────────────────────────
  lambda:
    name: Lambda (Node 26)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/aws/lando-alexa-smart-home

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6

      - name: 🔧 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: src/aws/lando-alexa-smart-home/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔎 Lint
        run: npm run lint

      - name: 🖋️ Format check
        run: npm run format:check

      - name: 🧪 Test with coverage
        run: npm run test:coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: src/aws/lando-alexa-smart-home/coverage
          flags: lambda
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: 🏗️ Build (verify bundle)
        run: npm run build

  # ─────────────────────────────────────────────
  # Terraform format + validate
  # ─────────────────────────────────────────────
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: 🖋️ Format check
        run: terraform fmt -check -recursive

      - name: ⚙️ Init (backend disabled for validate)
        run: terraform init -backend=false

      - name: ✅ Validate
        run: terraform validate
