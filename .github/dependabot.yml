version: 2

updates:
  # NuGet — .NET projects
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      dotnet-minor:
        update-types:
          - minor
          - patch
    ignore:
      # Majors track the .NET target framework; move them with it, by hand.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore

  # npm — AWS Lambda proxy
  - package-ecosystem: npm
    directory: /src/aws/lando-alexa-proxy
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      npm-minor:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node follows the Lambda runtime's Node major, not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Terraform providers
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore

  - package-ecosystem: "docker"
    directories:
      - "src/azure/Lando.FunctionApp/"
    schedule:
      interval: "daily"
    ignore:
      # The SDK image major follows the .NET target framework.
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
