name: Question
description: Ask about setup, configuration, or how something works
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the docs first:
        - [Getting started](../../docs/getting-started.md)
        - [Configuration reference](../../docs/configuration.md)
        - [Troubleshooting](../../docs/troubleshooting.md)
        - [FAQ](../../docs/faq.md)

  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What have you already tried?
      description: Steps taken, docs consulted, errors seen.
