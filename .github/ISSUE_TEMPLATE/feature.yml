name: Feature request
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, check whether the [extending-device-types guide](../../docs/extending-device-types.md)
        already covers what you need — many new device types can be added without a core change.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the use case. What are you trying to do that isn't possible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >
        What would you like to see added or changed? Include any relevant Alexa API
        capability names or Home Assistant service/domain names if applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR for this
