Length="215.9199" x="21.31" y="279.2803">Smart Home API + Event Gateway</text></g><!--entity lambda--><g class="entity" data-qualified-name="lambda" data-source-line="26" id="ent0003"><rect fill="#DCEEF8" height="90" rx="4" ry="4" style="stroke:#2E86AB;stroke-width:0.5;" width="201.2754" x="272.63" y="380.5"/><text fill="#222222" font-family="Helvetica" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="59.9102" x="343.3126" y="401.2803">&#171;system&#187;</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="86.3721" x="282.63" y="415.2803">AWS Lambda</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.1582" x="282.63" y="429.2803">[external runtime]</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="151.7305" x="282.63" y="443.2803">lando-alexa-smart-home</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="181.2754" x="282.63" y="457.2803">&#8212; HMAC-signs and forwards</text></g><!--entity func--><g class="entity" data-qualified-name="func" data-source-line="27" id="ent0004"><rect fill="#DCEEF8" height="90" rx="4" ry="4" style="stroke:#2E86AB;stroke-width:0.5;" width="209.0889" x="24.73" y="558.5"/><text fill="#222222" font-family="Helvetica" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="59.9102" x="99.3194" y="579.2803">&#171;system&#187;</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="129.9648" x="34.73" y="593.2803">Azure Container App</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.1582" x="34.73" y="607.2803">[external runtime]</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="125.3164" x="34.73" y="621.2803">Lando Function App</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.0889" x="34.73" y="635.2803">&#8212; verify + dispatch + translate</text></g><!--entity tailscale--><g class="entity" data-qualified-name="tailscale" data-source-line="28" id="ent0005"><rect fill="#E8F0E0" height="62" rx="4" ry="4" style="stroke:#5B8C3E;stroke-width:0.5;" width="124.2617" x="67.14" y="736.5"/><text fill="#222222" font-family="Helvetica" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="64.5928" x="96.9745" y="757.2803">&#171;network&#187;</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.2617" x="77.14" y="771.2803">Tailscale overlay</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="87.9238" x="77.14" y="785.2803">[private mesh]</text></g><!--entity ha--><g class="entity" data-qualified-name="ha" data-source-line="29" id="ent0006"><rect fill="#EFEFEF" height="76" rx="4" ry="4" style="stroke:#888888;stroke-width:0.5;" width="178.334" x="40.1" y="886.5"/><text fill="#222222" font-family="Helvetica" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="65.3789" x="96.5775" y="907.2803">&#171;external&#187;</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="98.0342" x="50.1" y="921.2803">Home Assistant</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4824" x="50.1" y="935.2803">[local network]</text><text fill="#222222" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="158.334" x="50.1" y="949.2803">REST + WebSocket APIs</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="41" id="ent0019"><path d="M268.47,570 L268.47,599.5 L234.11,603.5 L268.47,607.5 L268.47,637 A4,4 0 0 0 272.47,641 L474.0652,641 A4,4 0 0 0 478.0652,637 L478.0652,576 L468.0652,566 L272.47,566 A4,4 0 0 0 268.47,570" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M468.0652,566 L468.0652,574 A2,2 0 0 0 470.0652,576 L478.0652,576 L468.0652,566" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="157.5361" x="274.47" y="581.0103">Single Azure Function App.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="188.5952" x="274.47" y="594.0103">No public ingress to the home &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="159.707" x="274.47" y="607.0103">the home LAN dials *out* to</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.9707" x="274.47" y="620.0103">Tailscale; the Azure side dials</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="137.2935" x="274.47" y="633.0103">*into* the same overlay.</text></g><!--link user to alexa--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="31" id="lnk7"><path d="M129.27,128.76 C129.27,155.79 129.27,185.24 129.27,211.09" fill="none" id="user-to-alexa" style="stroke:#555555;stroke-width:1;"/><polygon fill="#555555" points="129.27,216.09,133.27,207.09,129.27,211.09,125.27,207.09,129.27,216.09" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#333333" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="62.8735" x="130.27" y="169.5103">voice / app</text><text fill="#333333" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="159.9009" y="182.5103">&#160;</text><text fill="#333333" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="93.9453" x="28.3591" y="205.3813">turn on the lamp</text></g><!--link alexa to lambda--><g class="link" data-entity-1="ent00